name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew and tap
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
      - run: brew audit --strict adiosdotdev/tap/adios
      - run: brew install adiosdotdev/tap/adios
      - run: brew test adiosdotdev/tap/adios
